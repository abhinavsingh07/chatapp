events { }

http {
    upstream backend_servers {
        # If backend fails 3 times within 10 seconds, temporarily stop sending traffic there.
        server chatbackend1:8080 max_fails=3 fail_timeout=10s;  # service name from docker-compose
        # server chatbackend2:8080 max_fails=3 fail_timeout=10s;  # service name from docker-compose 
    }

    # 1. New Server Block: Automatically redirect all HTTP traffic (Port 80) to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name localhost; # Change this if you are using a custom domain like myapp.local

        return 301 https://$host$request_uri;
    }

    # 2. Updated Server Block: Handles HTTPS (Port 443) and WebSockets
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost; # Change this if you are using a custom domain like myapp.local

        # --- MKCERT SSL CONFIGURATION ---
        # If running Nginx on Windows host, use standard paths like: "C:/path/to/localhost+1.pem"
        # If running Nginx in Docker, mount these files and use the container path like below:
        ssl_certificate     /etc/nginx/certs/localhost+1.pem;
        ssl_certificate_key /etc/nginx/certs/localhost+1-key.pem;

        # Recommended local SSL protocols for security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # ---------------------------------

        # Dedicated WebSocket Endpoint Handler
        location /synk/ {
            proxy_pass http://backend_servers; # Forward all requests to Spring Boot app.
            
            # WebSocket protocol-switching headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade"; # CAPITAL "U" is safest for all clients
            
            # Context headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep-Alive Timeouts (Prevents connection drops every 60 seconds)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Serve media files directly
        # location /media/ {
        #     alias /usr/share/nginx/html/media/;
        #     autoindex on;
        # }
    }
}
