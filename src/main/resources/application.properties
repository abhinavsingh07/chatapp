## Application settings
spring.application.name=synk
server.servlet.context-path=/synk
server.port=8080
#Spring framework caching
#logging.level.org.springframework=DEBUG

# Set log levels
logging.level.root=INFO
logging.level.com.yourpackage=DEBUG

# Enable file logging
logging.file.name=logs/app.log

# Customize log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#Cache Logging
#logging.level.org.springframework.cache=TRACE

expose health, info, metrics and all other actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# optional: change base path (default is /actuator)
management.endpoints.web.base-path=/actuator

# show health details (useful for Docker healthcheck)
management.endpoint.health.show-details=always

#enable prometheus endpoint
management.endpoint.prometheus.enabled=true

# Tells Micrometer to automatically tag every single metric with your app name
management.metrics.tags.application=synk

# spring.profiles.active=${SPRING_PROFILES_ACTIVE}

#important for docker to get the correct client IP address when behind a reverse proxy or load balancer. This is especially useful when using Spring Security or logging the client IP address.
#If Spring Boot thinks the user is on HTTP, it writes URLs like this inside the JSON file:http://yourdomain.com
#so this property tells Springboot that request came from a https connection.
#for example swagger-ui.html will be available at https://yourdomain.com/synk/swagger-ui.html instead of http://yourdomain.com/synk/swagger-ui.html
server.forward-headers-strategy=framework



